aid: preply
name: Preply
description: >-
  Preply is a global online language-learning marketplace that connects learners
  with private tutors across dozens of languages, offering one-on-one video
  lessons, flexible scheduling and a satisfaction-backed tutor-replacement
  guarantee. Alongside its consumer marketplace, Preply runs Preply Business, an
  enterprise language-training offering with SSO, automated user provisioning and
  LMS integrations. Preply exposes a small public, unauthenticated tutor-search
  API (originally published as an OpenAI/ChatGPT plugin) that lets applications
  and agents search tutors by subject, price, availability and language and fetch
  individual tutor profiles. This profile was enriched by the API Evangelist
  pipeline from Preply's public surface.
